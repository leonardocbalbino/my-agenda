# Infra local: pnpm db:up
services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      # Superusuário só para bootstrap (pnpm db:setup). A app usa marcai_app.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
